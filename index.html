<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efeito Hover Capitã Marvel</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fff; /* Fundo branco da página */
            font-family: sans-serif;
            overflow: hidden; /* Evita barras de rolagem */
        }

        .container {
            width: 500px;
            height: 350px;
            background: linear-gradient(45deg, #d41e31, #491f8f);
            position: relative;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            overflow: visible; /* Permite que a cabeça saia */
        }

        .image-box {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            height: 120%; /* Faz a imagem ser maior que o retângulo */
            transition: left 0.5s ease; /* Animação para mover para o lado */
            z-index: 10;
        }

        .image-box img {
            height: 100%;
            display: block;
        }

        .text-box {
            width: 50%;
            padding: 20px;
            color: #fff;
            opacity: 0; /* Escondido inicialmente */
            transform: translateX(-20px);
            transition: all 0.5s ease;
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
        }

        .container:hover .image-box {
            left: 75%; /* Move a imagem para o lado direito no hover */
        }

        .container:hover .text-box {
            opacity: 1; /* Mostra o texto no hover */
            transform: translateY(-50%) translateX(0); /* Ajusta a posição */
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="text-box">
            <h2>Poderes Cósmicos</h2>
            <p id="random-text">Passando o mouse para ver os poderes dela!</p>
        </div>

        <div class="image-box">
            <img src="Captura_de_tela_2026-05-18_08-32-31-removebg-preview.png" alt="Capitã Marvel">
        </div>
    </div>

    <script>
        // Array de frases aleatórias
        const frases = [
            "Ela possui força sobre-humana!",
            "Consegue voar a velocidades estelares.",
            "Absorve e projeta energia cósmica.",
            "Tem resistência e durabilidade incriveis.",
            "Liderou os Vingadores em batalha.",
            "Pode sobreviver no vácuo do espaço.",
            "Possui um 'sétimo sentido' de perigo."
        ];

        const container = document.querySelector('.container');
        const textElement = document.getElementById('random-text');

        // Mudar o texto toda vez que o mouse passar por cima
        container.addEventListener('mouseenter', () => {
            const randomIndex = Math.floor(Math.random() * frases.length);
            textElement.textContent = frases[randomIndex];
        });
    </script>
</body>
</html>
