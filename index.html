<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efeito Capitã Marvel</title>
    <style>
        /* Configuração do fundo da página (Branco) */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* O Retângulo Central com o Gradiente solicitado */
        .card-container {
            position: relative;
            width: 650px;
            height: 400px;
            background: linear-gradient(45deg, #d41e31, #491f8f);
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
        }

        /* Container da Imagem (ocupa metade do card inicialmente) */
        .image-box {
            position: absolute;
            left: 0;
            top: 0;
            width: 50%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 2;
            pointer-events: none; /* Mantém a suavidade do hover no container */
        }

        .image-box img {
            height: 95%;
            object-fit: contain;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
        }

        /* Container do Texto (fica do lado esquerdo, escondido inicialmente) */
        .text-box {
            position: absolute;
            left: 0;
            top: 0;
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
            opacity: 0;
            transform: translateX(-20px);
            transition: all 0.5s ease;
            color: #ffffff;
            text-align: center;
            z-index: 1;
        }

        .text-box h2 {
            margin: 0 0 15px 0;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
        }

        .text-box p {
            font-size: 1rem;
            line-height: 1.5;
            margin: 0;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
        }

        /* --- EFEITO HOVER (Quando passa o mouse no Retângulo) --- */
        
        /* Move a imagem para o outro lado (direita) */
        .card-container:hover .image-box {
            transform: translateX(100%);
        }

        /* Mostra o texto do lado esquerdo */
        .card-container:hover .text-box {
            opacity: 1;
            transform: translateX(0);
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="text-box">
            <h2>Capitã Marvel</h2>
            <p id="random-text">Passe o mouse para descobrir um fato cósmico!</p>
        </div>

        <div class="image-box">
            <img src="Captura_de_tela_2026-05-18_08-32-31-removebg-preview.png" alt="Capitã Marvel">
        </div>
    </div>

    <script>
        // Lista de textos aleatórios sobre a personagem
        const fatosConst = [
            "Carol Danvers era uma das pilotos mais brilhantes da Força Aérea Americana antes de obter seus poderes cósmicos.",
            "Ela possui força sobre-humana, capacidade de voar em velocidades supersônicas e pode absorver e projetar energia.",
            "Seu DNA foi fundido com a tecnologia Kree, transformando-a em um híbrido humano-Kree extremamente poderoso.",
            "Seu gato de estimação, Goose, parece fofo, mas na verdade é um Flerken, uma espécie alienígena perigosíssima!",
            "Ela já utilizou outros codinomes marcantes nos quadrinhos, como Binária e Warbird.",
            "É frequentemente descrita como uma das linhas de frente de defesa mais poderosas de todo o universo Marvel."
        ];

        const card = document.querySelector('.card-container');
        const textElement = document.getElementById('random-text');

        // Evento que detecta quando o mouse entra no retângulo
        card.addEventListener('mouseenter', () => {
            // Sorteia um índice da nossa lista de textos
            const randomIndex = Math.floor(Math.random() * fatosConst.length);
            // Atualiza o parágrafo com o texto sorteado
            textElement.textContent = fatosConst[randomIndex];
        });
    </script>

</body>
</html>
