<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efeito Hover Capitã Marvel</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fff; /* Fundo branco da página */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            width: 500px;
            height: 350px;
            background: linear-gradient(45deg, #d41e31, #491f8f);
            position: relative;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            overflow: visible; /* Permite que a cabeça saia pelo topo */
            cursor: pointer;
        }

        .image-box {
            position: absolute;
            bottom: 0; /* Alinha a base da imagem perfeitamente com o fundo */
            left: 50%; /* Centraliza horizontalmente antes do hover */
            transform: translateX(-50%);
            width: auto;
            height: 135%; /* Faz a imagem passar um pouco do topo do retângulo */
            transition: left 0.5s cubic-bezier(0.25, 1, 0.5, 1); /* Transição suave */
            z-index: 10;
        }

        .image-box img {
            height: 100%;
            display: block;
            object-fit: contain;
        }

        .text-box {
            width: 45%; /* Limita o tamanho do texto para não bater na imagem */
            padding: 30px;
            color: #fff;
            opacity: 0; /* Escondido inicialmente */
            transform: translateY(-50%) translateX(-20px);
            transition: all 0.5s ease;
            position: absolute;
            left: 0;
            top: 50%;
            pointer-events: none; /* Evita que o texto quebre o efeito de passar o mouse */
        }

        .text-box h2 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
        }

        .text-box p {
            font-size: 0.95rem;
            line-height: 1.4;
            margin-bottom: 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
        }

        /* --- EFEITO HOVER --- */
        
        /* Afasta a imagem bem para a direita para dar espaço ao texto */
        .container:hover .image-box {
            left: 78%; 
        }

        /* Mostra o texto do lado esquerdo */
        .container:hover .text-box {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="text-box">
            <h2>Capitã Marvel</h2>
            <p id="random-text">Passe o mouse para ler um fato cósmico!</p>
        </div>

        <div class="image-box">
            <img src="Captura_de_tela_2026-05-18_08-32-31-removebg-preview.png" alt="Capitã Marvel">
        </div>
    </div>

    <script>
        // Lista de frases sobre a personagem
        const fatos = [
            "Ela possui força sobre-humana e a capacidade de voar a velocidades estelares.",
            "Absorve e projeta energia cósmica, sendo uma das heroínas mais poderosas.",
            "Já liderou os Vingadores nos quadrinhos, mostrando sua liderança nata.",
            "Consegue sobreviver e lutar no vácuo do espaço sem nenhum traje especial.",
            "Seu DNA é um híbrido perfeito entre genética humana e tecnologia Kree.",
            "Seu gato de estimação, Goose, é na verdade um perigosíssimo Flerken alienígena!"
        ];

        const container = document.querySelector('.container');
        const textElement = document.getElementById('random-text');

        // Sorteia um novo texto toda vez que o mouse entra no retângulo
        container.addEventListener('mouseenter', () => {
            const randomIndex = Math.floor(Math.random() * fatos.length);
            textElement.textContent = fatos[randomIndex];
        });
    </script>
</body>
</html>
