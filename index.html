<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efeito Capitã Marvel</title>
    <style>
        /* Configuração do fundo solicitado */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(45deg, #d41e31, #491f8f);
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Container da imagem */
        .image-container {
            position: relative;
            cursor: pointer;
            transition: transform 0.5s ease;
        }

        /* Estilização da imagem */
        .marvel-img {
            max-width: 400px;
            height: auto;
            display: block;
            /* Suaviza a transição dos filtros */
            transition: all 0.4s ease-in-out;
            /* Remove fundos estranhos se a imagem for transparente */
            background: transparent; 
        }

        /* --- O EFEITO HOVER (Passar o mouse) --- */
        
        /* 1. Faz a imagem crescer levemente e adiciona um brilho dourado intenso (drop-shadow) */
        .image-container:hover .marvel-img {
            transform: scale(1.05);
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.8)) brightness(1.2);
        }

        /* 2. Cria um efeito de pulsação/aura no fundo da imagem */
        .image-container::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, rgba(255,191,0,0.4) 0%, rgba(0,0,0,0) 70%);
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.5s ease, opacity 0.5s ease;
            z-index: -1;
            opacity: 0;
        }

        .image-container:hover::before {
            transform: translate(-50%, -50%) scale(1.5);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="image-container">
        <img src="1000090704.jpg" alt="Capitã Marvel" class="marvel-img">
    </div>

</body>
</html>
